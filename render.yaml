services:
  - type: web
    name: reforma-chacara-api
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/expenses
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PREFERRED_MODELS
        value: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-3-flash-preview
